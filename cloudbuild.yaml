# cloudbuild.yaml
# Google Cloud Build configuration for FestMoment

# Substitution variables (set these in Cloud Build trigger or command line)
# _REGION: GCP region (e.g., asia-northeast3)
# _CLOUD_SQL_CONNECTION: Cloud SQL connection name
# _VPC_CONNECTOR: VPC connector name for Redis

substitutions:
  _REGION: asia-northeast3
  _API_SERVICE: festmoment-api
  _FRONTEND_SERVICE: festmoment-frontend
  _CELERY_SERVICE: festmoment-celery

steps:
  # ============================================
  # Step 1: Build API Server Image
  # ============================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_API_SERVICE}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_API_SERVICE}:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    id: 'build-api'

  # ============================================
  # Step 2: Build Frontend Image
  # ============================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_FRONTEND_SERVICE}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_FRONTEND_SERVICE}:latest'
      - '--build-arg'
      - 'VITE_API_URL=https://${_API_SERVICE}-$PROJECT_ID.${_REGION}.run.app'
      - '--build-arg'
      - 'VITE_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}'
      - '-f'
      - 'frontend/Dockerfile'
      - 'frontend/'
    id: 'build-frontend'

  # ============================================
  # Step 3: Build Celery Worker Image
  # ============================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_CELERY_SERVICE}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_CELERY_SERVICE}:latest'
      - '-f'
      - 'Dockerfile.celery'
      - '.'
    id: 'build-celery'

  # ============================================
  # Step 4: Push Images to Container Registry
  # ============================================
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_API_SERVICE}:$COMMIT_SHA']
    id: 'push-api'
    waitFor: ['build-api']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_API_SERVICE}:latest']
    waitFor: ['push-api']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_FRONTEND_SERVICE}:$COMMIT_SHA']
    id: 'push-frontend'
    waitFor: ['build-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_FRONTEND_SERVICE}:latest']
    waitFor: ['push-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_CELERY_SERVICE}:$COMMIT_SHA']
    id: 'push-celery'
    waitFor: ['build-celery']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_CELERY_SERVICE}:latest']
    waitFor: ['push-celery']

  # ============================================
  # Step 5: Deploy API Server to Cloud Run
  # ============================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_API_SERVICE}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_API_SERVICE}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-cloudsql-instances'
      - '${_CLOUD_SQL_CONNECTION}'
      - '--vpc-connector'
      - '${_VPC_CONNECTOR}'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,NAVER_CLIENT_ID=NAVER_CLIENT_ID:latest,NAVER_CLIENT_SECRET=NAVER_CLIENT_SECRET:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,PRECACHE_API_KEY=PRECACHE_API_KEY:latest'
    id: 'deploy-api'
    waitFor: ['push-api']

  # ============================================
  # Step 6: Deploy Frontend to Cloud Run
  # ============================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_FRONTEND_SERVICE}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_FRONTEND_SERVICE}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--concurrency'
      - '200'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
    id: 'deploy-frontend'
    waitFor: ['push-frontend', 'deploy-api']

  # ============================================
  # Step 7: Deploy Celery Worker to Cloud Run
  # ============================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_CELERY_SERVICE}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_CELERY_SERVICE}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '3600'
      - '--concurrency'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '3'
      - '--set-cloudsql-instances'
      - '${_CLOUD_SQL_CONNECTION}'
      - '--vpc-connector'
      - '${_VPC_CONNECTOR}'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,NAVER_CLIENT_ID=NAVER_CLIENT_ID:latest,NAVER_CLIENT_SECRET=NAVER_CLIENT_SECRET:latest'
    id: 'deploy-celery'
    waitFor: ['push-celery', 'deploy-api']

# Images to store in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/${_API_SERVICE}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_API_SERVICE}:latest'
  - 'gcr.io/$PROJECT_ID/${_FRONTEND_SERVICE}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_FRONTEND_SERVICE}:latest'
  - 'gcr.io/$PROJECT_ID/${_CELERY_SERVICE}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_CELERY_SERVICE}:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Build timeout (30 minutes)
timeout: '1800s'
