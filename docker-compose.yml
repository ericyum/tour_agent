# docker-compose.yml
# FestMoment 프로덕션 환경 (Nginx + FastAPI + Celery + Redis + PostgreSQL)
#
# 로컬 실행:
#   docker-compose up -d
#   - Swagger UI: http://localhost/docs (ID: admin / PW: admin123)
#   - Flower: http://localhost/flower/ (ID: admin / PW: admin123)
#   - API: http://localhost/api/...
#
# GCP 배포:
#   1. GCP VM에서 docker-compose up -d
#   2. 외부 IP로 접속
#   - Swagger: http://YOUR_IP/docs
#   - Flower: http://YOUR_IP/flower/

services:
  # Nginx Reverse Proxy (포트 80으로 통합 접속)
  nginx:
    image: nginx:alpine
    container_name: festmoment-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - api-server
      - celery-flower
    restart: unless-stopped

  # FastAPI Backend (API Server)
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: festmoment-api-server
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://festmoment:festmoment_password@postgres:5432/festmoment
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped

  # PostgreSQL (메인 데이터베이스)
  postgres:
    image: postgres:15-alpine
    container_name: festmoment-postgres
    environment:
      POSTGRES_USER: festmoment
      POSTGRES_PASSWORD: festmoment_password
      POSTGRES_DB: festmoment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festmoment -d festmoment"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (캐시 + 메시지 브로커)
  redis:
    image: redis:7-alpine
    container_name: festmoment-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Celery Worker (비동기 작업 처리)
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: festmoment-celery-worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://festmoment:festmoment_password@postgres:5432/festmoment
    env_file:
      - .env
    volumes:
      - .:/app
      - ./cache:/app/cache
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A src.celery.app worker --loglevel=info --pool=solo
    restart: unless-stopped

  # Celery Flower (모니터링 대시보드)
  celery-flower:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: festmoment-celery-flower
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery-worker
    command: celery -A src.celery.app flower --port=5555
    restart: unless-stopped

  # Celery Beat (스케줄러 - 자동 사전 캐싱)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: festmoment-celery-beat
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://festmoment:festmoment_password@postgres:5432/festmoment
    env_file:
      - .env
    volumes:
      - .:/app
      - ./cache:/app/cache
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      celery-worker:
        condition: service_started
    command: celery -A src.celery.app beat --loglevel=info
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
