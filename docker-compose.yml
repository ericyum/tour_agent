# docker-compose.yml
# FestMoment 개발 환경 (Redis + Celery + 자동 캐싱)
#
# 실행 방법:
#   docker-compose up -d     # 백그라운드 실행
#   docker-compose down      # 종료
#   docker-compose logs -f   # 로그 확인
#
# 수동 전수 캐싱 시작:
#   docker-compose exec celery-worker python -c "from precache_tasks import precache_all_festivals; precache_all_festivals.delay()"
#
# 캐싱 진행 상황 모니터링:
#   http://localhost:5555 (Flower 대시보드)

services:
  # PostgreSQL (메인 데이터베이스)
  postgres:
    image: postgres:15-alpine
    container_name: festmoment-postgres
    environment:
      POSTGRES_USER: festmoment
      POSTGRES_PASSWORD: festmoment_password
      POSTGRES_DB: festmoment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festmoment -d festmoment"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (캐시 + 메시지 브로커)
  redis:
    image: redis:7-alpine
    container_name: festmoment-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Celery Worker (비동기 작업 처리)
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: festmoment-celery-worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://festmoment:festmoment_password@postgres:5432/festmoment
    env_file:
      - .env
    volumes:
      - .:/app
      - ./cache:/app/cache
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A celery_app worker --loglevel=info --pool=solo
    restart: unless-stopped

  # Celery Flower (모니터링 대시보드)
  celery-flower:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: festmoment-celery-flower
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery-worker
    command: celery -A celery_app flower --port=5555
    restart: unless-stopped

  # Celery Beat (스케줄러 - 자동 사전 캐싱)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: festmoment-celery-beat
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://festmoment:festmoment_password@postgres:5432/festmoment
    env_file:
      - .env
    volumes:
      - .:/app
      - ./cache:/app/cache
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      celery-worker:
        condition: service_started
    command: celery -A celery_app beat --loglevel=info
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
